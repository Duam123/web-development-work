<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - MediConnect Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:520px;">
    <div class="text-center mb-4">
      <i class="bi bi-heart-pulse-fill" style="font-size:2.4rem;color:var(--brand);"></i>
      <h3 class="fw-bold mt-2 mb-0">Create your account</h3>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">I am a...</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="role" id="role_patient" value="patient" checked onclick="toggleDoctorFields()">
          <label class="btn btn-outline-success" for="role_patient"><i class="bi bi-person"></i> Patient</label>

          <input type="radio" class="btn-check" name="role" id="role_doctor" value="doctor" onclick="toggleDoctorFields()">
          <label class="btn btn-outline-success" for="role_doctor"><i class="bi bi-file-earmark-medical"></i> Doctor</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>

      <div id="doctor_fields" style="display:none;">
        <div class="mb-3">
          <label class="form-label">Specialty</label>
          <input type="text" name="specialty" class="form-control" placeholder="e.g. Cardiologist">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" placeholder="e.g. Karachi">
      </div>

      <button type="submit" class="btn btn-brand w-100 py-2">Create Account</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>

<script>
function toggleDoctorFields() {
  const isDoctor = document.getElementById('role_doctor').checked;
  document.getElementById('doctor_fields').style.display = isDoctor ? 'block' : 'none';
}
</script>
</body>
</html>
